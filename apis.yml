aid: foundry-group
name: Foundry Group
description: >-
  Foundry Group is a Boulder, Colorado venture capital firm founded in 2007 by Brad Feld, Seth Levine,
  Ryan McIntyre, and Jason Mendelson. The firm invests in early-stage technology startups across the
  United States, organizing its work around long-lived, horizontal investment themes (such as "glue",
  "protocol", "distribution", and "human computer interaction") rather than narrow verticals, with a
  particular affinity for hardware, robotics, consumer internet, developer tools, and B2B SaaS. Foundry
  pioneered a "network-driven" model that operates both as a direct investor in startups and as a limited
  partner in a curated network of more than 40 partner venture funds. The firm manages more than $3.0B for
  its limited partners, has made 320+ investments and 70+ exits, and is known for radical transparency
  through the books, blogs, and podcasts of its partners. Notable investments include Fitbit, Zynga,
  SendGrid, MakerBot, Gnip, Mapbox, SeatGeek, and WHOOP. In 2022 the partners announced Foundry would not
  raise another fund, continuing to steward its existing funds and portfolio through their life.
